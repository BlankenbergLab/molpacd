[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molpacd"
version = "0.1.0"
description = "Molecular Pore Aperture Cap Designer"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Jayadev Joshi" },
  { name = "Bryan Raubenolt" },
  { name = "Daniel Blankenberg" },
]
keywords = [
  "protein",
  "pore",
  "channel",
  "membrane",
  "pdb",
  "mmcif",
  "molecular-dynamics",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "biopython>=1.80",
  "numpy>=1.21,<2.5",
]

[project.optional-dependencies]
dev = [
  "build>=1.0",
  "mypy>=1.8,<2",
  "nox>=2024.4.15",
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.4.0",
  "setuptools>=68",
  "twine>=5.0",
  "wheel",
]

[project.scripts]
molpacd = "molpacd.cli:main"

[project.urls]
Homepage = "https://github.com/BlankenbergLab/molpacd"
Repository = "https://github.com/BlankenbergLab/molpacd"
Issues = "https://github.com/BlankenbergLab/molpacd/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
molpacd = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["molpacd"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["UP006", "UP007", "UP035", "UP037", "UP045"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.9"
packages = ["molpacd"]
strict = true
warn_return_any = false

[[tool.mypy.overrides]]
module = ["Bio.*"]
ignore_missing_imports = true
